# Builds ImageGen on GitHub's own Windows machines and attaches the results
# to a release - so you don't have to build or upload anything by hand.
#
# How to use it - either way, no command line needed for the first:
#   A. On github.com: Actions tab -> "Build and release" -> Run workflow.
#      It reads APP_VERSION from image_to_png_converter.py and makes the
#      release v<that version> itself.
#   B. Or from a terminal: git tag v1.13.0 && git push origin v1.13.0
#      (the tag has to match APP_VERSION).
#   Then watch the Actions tab. When it finishes, the release exists with the
#      app (ImageGen.zip), installer and updater attached, and the app starts
#      offering the update.
#
# Building here takes roughly 10-15 minutes.

name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # needed to create the release and attach files

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"     # 3.13+ has no wheels for some of these

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine Pillow pillow-heif pillow-avif-plugin rawpy
          pip install numpy onnxruntime requests moviepy imageio-ffmpeg
          pip install pyinstaller

      - name: Work out the version
        shell: bash
        run: |
          APP=$(grep -oP 'APP_VERSION = "\K[^"]+' image_to_png_converter.py)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag=$TAG  app=$APP"
            if [ "$TAG" != "$APP" ]; then
              echo "::error::Tag $TAG doesn't match APP_VERSION $APP - the update"
              echo "::error::check compares these, so they have to agree."
              exit 1
            fi
          else
            echo "Run by hand - releasing APP_VERSION $APP as v$APP"
          fi
          echo "RELEASE_TAG=v$APP" >> "$GITHUB_ENV"

      - name: Build the app
        run: |
          python prepare_icon.py
          python -m PyInstaller --onedir --windowed --clean --noconfirm `
            --name ImageGen `
            --collect-all rawpy --collect-all pillow_heif `
            --collect-all moviepy --collect-all imageio_ffmpeg `
            --collect-all imageio --collect-all proglog `
            --collect-all decorator --collect-all PIL `
            --collect-all pillow_avif --collect-all onnxruntime `
            --hidden-import moviepy.editor `
            --hidden-import PyQt6.QtWebEngineWidgets `
            --hidden-import PyQt6.QtWebEngineCore `
            --hidden-import PyQt6.sip `
            --add-data "iGlogo.png;." --add-data "iGlogo.ico;." `
            --icon app_icon.ico `
            image_to_png_converter.py
          python zip_app.py

      - name: Build the installer and updater
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm `
            --name ImageGenSetup `
            --add-data "iGlogo.png;." --add-data "iGlogo.ico;." `
            --icon app_icon.ico installer.py
          python -m PyInstaller --onefile --windowed --clean --noconfirm `
            --name ImageGenUpdater `
            --add-data "iGlogo.png;." --add-data "iGlogo.ico;." `
            --icon app_icon.ico updater.py

      - name: Build the extensions
        run: python build_extensions.py
        continue-on-error: true      # extensions are optional to the release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/ImageGen.zip
            dist/ImageGenSetup.exe
            dist/ImageGenUpdater.exe
            dist/extension_*.zip
          generate_release_notes: true
